name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA
        run: ./scripts/build.sh

      - name: Prepare release asset
        run: |
          # Dynamically find the IPA file that build.sh generated
          # This ignores branch/tag name mismatches
          IPA_FILE=$(find build -type f -name "Cyanide*.ipa" | head -n 1)
          
          if [ -z "$IPA_FILE" ]; then
            echo "error: No IPA found in build directory!" >&2
            ls -la build/
            exit 1
          fi
          
          echo "Successfully found IPA: $IPA_FILE"
          
          # Copy it to the final asset name you want uploaded
          cp "$IPA_FILE" build/cyanidex.ipa
          ls -lh build/cyanidex.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cyanide ${{ github.ref_name }}
          files: build/cyanidex.ipa
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true